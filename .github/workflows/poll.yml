name: poll-opencode-releases

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Generate threads without posting or updating state"
        required: false
        type: boolean
        default: true
      process_drafts:
        description: "Include draft releases when token access allows it"
        required: false
        type: boolean
        default: false
      tag:
        description: "Specific release tag to generate"
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    env:
      GITHUB_PROCESS_DRAFTS: ${{ github.event.inputs.process_drafts || 'false' }}
      GH_TOKEN: ${{ github.token }}
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
      TWITTER_APP_KEY: ${{ secrets.TWITTER_APP_KEY }}
      TWITTER_APP_SECRET: ${{ secrets.TWITTER_APP_SECRET }}
      TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
      TWITTER_ACCESS_SECRET: ${{ secrets.TWITTER_ACCESS_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run bot
        env:
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          INPUT_TAG: ${{ github.event.inputs.tag || '' }}
        run: |
          ARGS=()
          if [ "$INPUT_DRY_RUN" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          if [ -n "$INPUT_TAG" ]; then
            ARGS+=(--tag "$INPUT_TAG")
          fi
          bun run bot -- "${ARGS[@]}"

      - name: Persist state
        if: always() && github.event.inputs.dry_run != 'true'
        run: |
          if git diff --quiet -- data/posted-releases.json; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/posted-releases.json
          git commit -m "chore: record posted releases"
          git push
